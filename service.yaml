apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-risk
  labels: {app: heart-api}
spec:
  # LoadBalancer gets an external IP via `minikube tunnel`;
  # the fixed nodePort also works directly via `minikube service`.
  type: LoadBalancer
  selector: {app: heart-api}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
