apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-risk
  labels: {app: heart-api}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: heart-api}
  template:
    metadata:
      labels: {app: heart-api}
      annotations:
        # picked up by the Prometheus pod-discovery job in k8s/monitoring
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          # Image is loaded into minikube with `minikube image load` (never pulled).
          # For a registry deploy, swap to ghcr.io/<user>/heart-risk-api:latest + IfNotPresent.
          image: heart-risk-api:v1
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: DECISION_THRESHOLD, value: "0.5"}
            - {name: LOG_LEVEL, value: "INFO"}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
