groups:
  - name: heart-api
    rules:
      - alert: HeartApiDown
        expr: sum(up{job="heart-api"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "No heart-api pod is being scraped successfully"}
      - alert: HeartApiHighErrorRate
        expr: |
          sum(rate(heart_api_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(heart_api_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "More than 5% of heart-api requests are failing"}
      - alert: HeartApiSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(heart_api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 500 ms"}
